[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hub-cli"
version = "0.1.0"
description = "A modular terminal CLI for agenda, notes, mail, weather, and library search."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0"
]

[project.scripts]
hub = "hub.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
